<div
  class="card"
  (click)="openProduct()">

  <img
    [src]="product.imageUrl"
    [alt]="product.name"
    class="card-image">

  <div class="card-content">

    <h3>
      {{ product.name }}
    </h3>

    <p>
      {{ product.description }}
    </p>

    <p class="price">
      {{ product.price | currency:'BRL' }}
    </p>

    <button
      class="cart-button"
      (click)="addToCart($event)">

      @if (added()) {
        ✓ Adicionado
      } @else {
        Adicionar ao carrinho
      }

    </button>

  </div>

</div>
