spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartstore}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartstore}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartstore}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.forward-headers-strategy=framework
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
server.address=0.0.0.0
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
smartstore.events.exchange=${USER_ACTIONS_EXCHANGE:smartstore.user-actions}
smartstore.events.queue=${USER_ACTIONS_QUEUE:smartstore.user-actions.queue}
smartstore.events.routing-key=${USER_ACTIONS_ROUTING_KEY:user-actions}
